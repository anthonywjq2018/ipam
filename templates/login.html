<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - IPAM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --brand-primary: #4f46e5;
            --brand-secondary: #7c3aed;
            --brand-accent: #06b6d4;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 35%, #4c1d95 70%, #0e7490 100%);
            background-attachment: fixed;
            overflow-x: hidden;
            position: relative;
        }

        /* 背景装饰光斑 */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.35;
            pointer-events: none;
            z-index: 0;
            animation: float 12s ease-in-out infinite;
        }
        .orb-1 { width: 420px; height: 420px; background: #6366f1; top: -120px; left: -100px; }
        .orb-2 { width: 380px; height: 380px; background: #a855f7; bottom: -100px; right: -80px; animation-delay: -4s; }
        .orb-3 { width: 280px; height: 280px; background: #06b6d4; top: 40%; left: 60%; animation-delay: -8s; opacity: 0.25; }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -30px) scale(1.08); }
        }

        /* 背景网格纹理 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 48px 48px;
            z-index: 0;
        }

        .login-wrap {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            padding: 24px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 24px;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35), 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            animation: cardIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(24px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .login-header {
            background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary));
            padding: 40px 32px 32px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .login-header::after {
            content: '';
            position: absolute;
            width: 200px; height: 200px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            top: -100px; right: -60px;
        }

        .login-header::before {
            content: '';
            position: absolute;
            width: 140px; height: 140px;
            border-radius: 50%;
            background: rgba(255,255,255,0.06);
            bottom: -70px; left: -40px;
        }

        .brand-logo {
            width: 72px; height: 72px;
            border-radius: 20px;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            position: relative;
            z-index: 1;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }

        .brand-logo i { font-size: 2.1rem; color: #fff; }

        .login-header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #fff;
            margin: 0 0 6px;
            position: relative;
            z-index: 1;
        }

        .login-header p {
            color: rgba(255,255,255,0.75);
            font-size: 0.875rem;
            margin: 0;
            position: relative;
            z-index: 1;
        }

        .login-body { padding: 32px 32px 28px; }

        .form-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #374151;
            margin-bottom: 0.45rem;
        }

        .input-group-text {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-right: none;
            color: #94a3b8;
            border-radius: 12px 0 0 12px;
        }

        .form-control {
            border: 1px solid #e2e8f0;
            border-left: none;
            border-radius: 0 12px 12px 0;
            padding: 0.7rem 1rem;
            font-size: 0.95rem;
            background: #fff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control:focus {
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 0.2rem rgba(79, 70, 229, 0.15);
            background: #fff;
        }

        .input-group:focus-within .input-group-text {
            border-color: var(--brand-primary);
            color: var(--brand-primary);
            background: #eef2ff;
        }

        .input-group:focus-within .form-control {
            border-color: var(--brand-primary);
        }

        .btn-login {
            width: 100%;
            padding: 0.8rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary));
            border: none;
            color: #fff;
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.35);
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 1.5rem;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(79, 70, 229, 0.45);
            color: #fff;
        }

        .btn-login:active { transform: translateY(0); }

        .login-footer {
            text-align: center;
            margin-top: 1.6rem;
            color: rgba(255,255,255,0.65);
            font-size: 0.8rem;
        }

        .alert { border-radius: 12px; font-size: 0.875rem; }

        @media (max-width: 480px) {
            .login-wrap { padding: 16px; }
            .login-header { padding: 32px 24px 26px; }
            .login-body { padding: 26px 24px 22px; }
        }
    </style>
</head>
<body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>

    <div class="login-wrap">
        <div class="login-card">
            <div class="login-header">
                <div class="brand-logo">
                    <i class="bi bi-hdd-network"></i>
                </div>
                <h1>IPAM</h1>
                <p>IP 地址管理系统 · 欢迎回来</p>
            </div>
            <div class="login-body">
                {% if error %}
                <div class="alert alert-danger d-flex align-items-center" role="alert">
                    <i class="bi bi-exclamation-circle-fill me-2"></i>
                    <span>{{ error }}</span>
                </div>
                {% endif %}
                <form id="loginForm" method="post">
                    <div class="mb-3">
                        <label class="form-label" for="username">用户名</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="username" name="username"
                                   required placeholder="请输入用户名" autofocus autocomplete="username">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="password">密码</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password"
                                   required placeholder="请输入密码" autocomplete="current-password">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-login">
                        <i class="bi bi-box-arrow-in-right me-2"></i>登 录
                    </button>
                </form>
            </div>
        </div>
        <div class="login-footer">
            <i class="bi bi-shield-lock me-1"></i>IP Address Management · Secure Access
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
