<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - IPAM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; }
        .login-card { max-width: 400px; margin: auto; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .navbar { background-color: #0d6efd; }
    </style>
</head>
<body>
    <div class="container">
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <div class="container-fluid">
                <a class="navbar-brand" href="/">IPAM</a>
                <div class="d-flex">
                    <div class="me-3">
                        <a class="nav-link" href="/">仪表盘</a>
                    </div>
                    <div class="ms-3">
                        <a class="nav-link" href="/switches">交换机</a>
                    </div>
                    <div class="ms-3">
                        <a class="nav-link" href="/bindings">IP-MAC 绑定</a>
                    </div>
                    <div class="ms-3">
                        <a class="nav-link" href="/logs">扫描日志</a>
                    </div>
                    <div class="ms-3">
                        <a class="nav-link" href="/login">登录</a>
                    </div>
                </div>
            </div>
        </nav>

        <div class="d-flex justify-content-center mt-5">
            <div class="card login-card bg-light" style="max-width: 400px;">
                <div class="card-body">
                    <div class="d-flex justify-content-between">
                        <div>
                            <h5 class="card-title">登录</h5>
                        </div>
                        <div>
                            <a href="/logs" class="btn btn-outline-secondary btn-sm"><i class="bi bi-journal-text"></i></a>
                        </div>
                    </div>
                    <form id="loginForm" class="mt-4">
                        <div class="mb-3">
                            <label class="form-label">用户名</label>
                            <input type="text" class="form-control" name="username" required placeholder="admin" autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">密码</label>
                            <input type="password" class="form-control" name="password" required placeholder="********">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">登录</button>
                    </form>
                    <div class="d-flex justify-content-between mt-3">
                        <a href="/register" class="btn btn-outline-secondary btn-sm">注册新账号</a>
                        <a href="/reset-password" class="btn btn-outline-secondary btn-sm">忘记密码</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
