{% extends "base.html" %}
{% block title %}交换机管理 - IPAM 系统{% endblock %}

{% block content %}
<!-- 页面标题 -->
<div class="row mb-4">
    <div class="col d-flex justify-content-between align-items-center">
        <h2 class="mb-0"><i class="bi bi-hdd-rack me-2"></i>交换机管理</h2>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#switchModal">
            <i class="bi bi-plus-circle me-1"></i>添加交换机
        </button>
    </div>
</div>

<!-- 统计卡片 -->
<div class="row g-3 mb-4" id="stats-cards">
    <div class="col-md-3">
        <div class="card stat-card h-100">
            <div class="card-body d-flex align-items-center">
                <div class="stat-icon bg-primary-subtle text-primary rounded-3 me-3">
                    <i class="bi bi-hdd-rack fs-4"></i>
                </div>
                <div>
                    <small class="text-muted">总交换机</small>
                    <h4 class="mb-0" id="total-switches">0</h4>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card stat-card h-100">
            <div class="card-body d-flex align-items-center">
                <div class="stat-icon bg-success-subtle text-success rounded-3 me-3">
                    <i class="bi bi-check-circle fs-4"></i>
                </div>
                <div>
                    <small class="text-muted">在线</small>
                    <h4 class="mb-0" id="online-switches">0</h4>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card stat-card h-100">
            <div class="card-body d-flex align-items-center">
                <div class="stat-icon bg-danger-subtle text-danger rounded-3 me-3">
                    <i class="bi bi-x-circle fs-4"></i>
                </div>
                <div>
                    <small class="text-muted">离线</small>
                    <h4 class="mb-0" id="offline-switches">0</h4>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card stat-card h-100">
            <div class="card-body d-flex align-items-center">
                <div class="stat-icon bg-info-subtle text-info rounded-3 me-3">
                    <i class="bi bi-link-45deg fs-4"></i>
                </div>
                <div>
                    <small class="text-muted">绑定总数</small>
                    <h4 class="mb-0" id="total-bindings">0</h4>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 交换机列表 -->
<div class="card">
    <div class="card-header">
        <h5 class="mb-0"><i class="bi bi-list-ul me-2"></i>交换机列表</h5>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>名称</th>
                        <th>IP 地址</th>
                        <th>厂商</th>
                        <th>位置</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="switch-table-body">
                    <tr>
                        <td colspan="6" class="text-center py-4">
                            <div class="spinner-border" role="status">
                                <span class="visually-hidden">加载中...</span>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- 添加/编辑交换机 Modal -->
<div class="modal fade" id="switchModal" tabindex="-1" aria-labelledby="switchModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="switchModalLabel">添加交换机</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="switch-form">
                    <input type="hidden" id="switch-id" name="id">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label" for="switch-name">名称 *</label>
                            <input type="text" class="form-control" id="switch-name" name="name" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="switch-ip">IP 地址 *</label>
                            <input type="text" class="form-control" id="switch-ip" name="ip" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="switch-port">端口</label>
                            <input type="number" class="form-control" id="switch-port" name="port" value="22">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="switch-username">用户名 *</label>
                            <input type="text" class="form-control" id="switch-username" name="username" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="switch-password">密码 *</label>
                            <input type="password" class="form-control" id="switch-password" name="password" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="switch-vendor">厂商</label>
                            <select class="form-select" id="switch-vendor" name="vendor">
                                <option value="H3C">H3C</option>
                                <option value="Huawei">Huawei</option>
                                <option value="Cisco">Cisco</option>
                                <option value="锐捷">锐捷</option>
                                <option value="中兴">中兴</option>
                            </select>
                        </div>
                        <div class="col-md-8">
                            <label class="form-label" for="switch-location">位置</label>
                            <input type="text" class="form-control" id="switch-location" name="location">
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="switch-notes">备注</label>
                            <textarea class="form-control" id="switch-notes" name="notes" rows="2"></textarea>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="save-switch-btn">保存</button>
            </div>
        </div>
    </div>
</div>

<!-- 测试连接 Modal -->
<div class="modal fade" id="testModal" tabindex="-1" aria-labelledby="testModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="testModalLabel">测试 SSH 连接</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body text-center">
                <div id="test-status" class="mb-3">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">测试中...</span>
                    </div>
                    <p class="mt-2">正在测试连接...</p>
                </div>
                <div id="test-result" class="alert d-none"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/switches.js') }}"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    loadSwitches();
    loadStats();
});

function loadSwitches() {
    axios.get('/api/switches')
        .then(response => {
            const tbody = document.getElementById('switch-table-body');
            tbody.innerHTML = '';
            response.data.switches.forEach(switch => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><a href="{{ url_for('switch_detail_page', switch_id=0) }}`.replace('0', switch.id) + '">' + switch.name + '</a></td>
                    <td>' + switch.ip + '</td>
                    <td>' + switch.vendor + '</td>
                    <td>' + (switch.location || '-') + '</td>
                    <td><span class="badge bg-' + (switch.is_active ? 'success' : 'secondary') + '">' + (switch.is_active ? '在线' : '离线') + '</span></td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary" onclick="editSwitch(' + switch.id + ')">
                            <i class="bi bi-pencil"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-success" onclick="testSwitch(' + switch.id + ')">
                            <i class="bi bi-link-45deg"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-info" onclick="scanSwitch(' + switch.id + ')">
                            <i class="bi bi-scan"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteSwitch(' + switch.id + ')">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        })
        .catch(error => {
            console.error('加载交换机失败:', error);
        });
}

function loadStats() {
    axios.get('/api/stats')
        .then(response => {
            const stats = response.data.stats;
            document.getElementById('total-switches').textContent = stats.total_switches || 0;
            document.getElementById('online-switches').textContent = stats.online_switches || 0;
            document.getElementById('offline-switches').textContent = stats.offline_switches || 0;
            document.getElementById('total-bindings').textContent = stats.total_bindings || 0;
        })
        .catch(error => {
            console.error('加载统计失败:', error);
        });
}

function editSwitch(id) {
    axios.get('/api/switches/' + id)
        .then(response => {
            const s = response.data.switch;
            document.getElementById('switch-id').value = s.id;
            document.getElementById('switch-name').value = s.name;
            document.getElementById('switch-ip').value = s.ip;
            document.getElementById('switch-port').value = s.port || 22;
            document.getElementById('switch-username').value = s.username;
            document.getElementById('switch-password').value = '';
            document.getElementById('switch-vendor').value = s.vendor || 'H3C';
            document.getElementById('switch-location').value = s.location || '';
            document.getElementById('switch-notes').value = s.notes || '';
            document.getElementById('switchModalLabel').textContent = '编辑交换机';
            const modal = new bootstrap.Modal(document.getElementById('switchModal'));
            modal.show();
        })
        .catch(error => {
            console.error('加载交换机失败:', error);
        });
}

function testSwitch(id) {
    const modal = new bootstrap.Modal(document.getElementById('testModal'));
    modal.show();
    document.getElementById('test-status').innerHTML = `
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">测试中...</span>
        </div>
        <p class="mt-2">正在测试连接...</p>
    `;
    document.getElementById('test-result').classList.add('d-none');
    
    axios.post('/api/switches/' + id + '/test')
        .then(response => {
            const result = document.getElementById('test-result');
            result.classList.remove('d-none');
            if (response.data.ok) {
                result.className = 'alert alert-success';
                result.textContent = response.data.message;
            } else {
                result.className = 'alert alert-danger';
                result.textContent = response.data.message;
            }
        })
        .catch(error => {
            const result = document.getElementById('test-result');
            result.classList.remove('d-none');
            result.className = 'alert alert-danger';
            result.textContent = '测试失败: ' + error.message;
        });
}

function scanSwitch(id) {
    if (!confirm('确定要扫描该交换机的 ARP 表吗？')) return;
    
    axios.post('/api/switches/' + id + '/scan')
        .then(response => {
            if (response.data.ok) {
                alert(response.data.message);
                loadSwitches();
                loadStats();
            } else {
                alert(response.data.message);
            }
        })
        .catch(error => {
            alert('扫描失败: ' + error.message);
        });
}

function deleteSwitch(id) {
    if (!confirm('确定要删除该交换机吗？')) return;
    
    axios.delete('/api/switches/' + id)
        .then(response => {
            if (response.data.ok) {
                alert(response.data.message);
                loadSwitches();
                loadStats();
            } else {
                alert(response.data.message);
            }
        })
        .catch(error => {
            alert('删除失败: ' + error.message);
        });
}

document.getElementById('save-switch-btn').addEventListener('click', function() {
    const id = document.getElementById('switch-id').value;
    const data = {
        name: document.getElementById('switch-name').value,
        ip: document.getElementById('switch-ip').value,
        port: document.getElementById('switch-port').value || 22,
        username: document.getElementById('switch-username').value,
        password: document.getElementById('switch-password').value,
        vendor: document.getElementById('switch-vendor').value,
        location: document.getElementById('switch-location').value,
        notes: document.getElementById('switch-notes').value
    };
    
    const url = id ? '/api/switches/' + id : '/api/switches';
    const method = id ? 'put' : 'post';
    
    axios({method, url, data})
        .then(response => {
            if (response.data.ok) {
                alert(response.data.message);
                bootstrap.Modal.getInstance(document.getElementById('switchModal')).hide();
                loadSwitches();
                loadStats();
                document.getElementById('switch-form').reset();
                document.getElementById('switch-id').value = '';
                document.getElementById('switchModalLabel').textContent = '添加交换机';
            } else {
                alert(response.data.message);
            }
        })
        .catch(error => {
            alert('操作失败: ' + error.message);
        });
});
</script>
{% endblock %}
