{% extends "base.html" %}
{% block title %}系统管理 - IPAM 系统{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col">
        <h2 class="mb-0"><i class="bi bi-gear me-2"></i>系统管理</h2>
    </div>
</div>

<!-- 系统状态卡片 -->
<div class="row g-4 mb-4">
    <div class="col-md-4">
        <div class="card stat-card h-100">
            <div class="card-body d-flex align-items-center">
                <div class="stat-icon bg-primary-subtle text-primary rounded-3 me-3">
                    <i class="bi bi-database fs-4"></i>
                </div>
                <div>
                    <small class="text-muted">数据库类型</small>
                    <h4 class="mb-0" id="db-type">-</h4>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card stat-card h-100">
            <div class="card-body d-flex align-items-center">
                <div class="stat-icon bg-info-subtle text-info rounded-3 me-3">
                    <i class="bi bi-shield-lock fs-4"></i>
                </div>
                <div>
                    <small class="text-muted">当前用户</small>
                    <h4 class="mb-0" id="current-user">-</h4>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card stat-card h-100">
            <div class="card-body d-flex align-items-center">
                <div class="stat-icon bg-success-subtle text-success rounded-3 me-3">
                    <i class="bi bi-check2-all fs-4"></i>
                </div>
                <div>
                    <small class="text-muted">系统状态</small>
                    <h4 class="mb-0" id="system-status">-</h4>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 数据库配置 -->
<div class="row g-4">
    <div class="col-lg-7">
        <div class="card h-100">
            <div class="card-header">
                <h5 class="mb-0"><i class="bi bi-database me-2"></i>数据库配置</h5>
            </div>
            <div class="card-body">
                <form id="db-form">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label" for="db-type-select">数据库类型</label>
                            <select class="form-select" id="db-type-select">
                                <option value="sqlite">SQLite</option>
                                <option value="mysql">MySQL</option>
                            </select>
                            <small class="text-muted">切换数据库类型需要重启服务</small>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="db-port">端口</label>
                            <input type="number" class="form-control" id="db-port" value="3306">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="db-host">主机</label>
                            <input type="text" class="form-control" id="db-host" placeholder="localhost">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="db-name">数据库名</label>
                            <input type="text" class="form-control" id="db-name" placeholder="ipam">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="db-user">数据库账号</label>
                            <input type="text" class="form-control" id="db-user" placeholder="root">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="db-password">数据库密码</label>
                            <input type="password" class="form-control" id="db-password" placeholder="••••••">
                        </div>
                    </div>
                    <div class="mt-4">
                        <button type="button" class="btn btn-primary" onclick="saveDbConfig()">保存配置</button>
                        <button type="button" class="btn btn-outline-secondary" onclick="testDb()">测试连接</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <div class="col-lg-5">
        <div class="card h-100">
            <div class="card-header">
                <h5 class="mb-0"><i class="bi bi-cloud-arrow-down me-2"></i>备份与恢复</h5>
            </div>
            <div class="card-body">
                <p class="text-muted small">支持导出备份文件，以及导入备份文件恢复系统数据。</p>
                <div class="d-flex gap-2">
                    <button class="btn btn-primary" onclick="backupDatabase()">
                        <i class="bi bi-download me-1"></i>导出备份
                    </button>
                    <button class="btn btn-outline-primary" onclick="document.getElementById('restore-file').click()">
                        <i class="bi bi-upload me-1"></i>导入备份
                    </button>
                </div>
                <input type="file" id="restore-file" class="d-none" accept=".db,.sqlite,.sqlite3">
                <div id="backup-result" class="mt-3"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function loadSystemInfo() {
    axios.get('/api/system/health').then(res => {
        const h = res.data;
        document.getElementById('db-type').textContent = h.database;
        document.getElementById('system-status').textContent = '正常';
        document.getElementById('current-user').textContent = 'admin';
    }).catch(e => {
        document.getElementById('system-status').textContent = '异常';
    });
}

function saveDbConfig() {
    const type = document.getElementById('db-type-select').value;
    const config = {
        type: type,
        host: document.getElementById('db-host').value,
        port: document.getElementById('db-port').value,
        name: document.getElementById('db-name').value,
        user: document.getElementById('db-user').value,
        password: document.getElementById('db-password').value
    };
    
    axios.post('/api/system/configs', {config_key: 'db_config', config_value: JSON.stringify(config)}).then(res => {
        if (res.data.ok) {
            alert('数据库配置已保存，重启服务后生效');
        } else {
            alert(res.data.message || '保存失败');
        }
    }).catch(e => alert('保存失败: ' + (e.response && e.response.data.message || e.message)));
}

function testDb() {
    const type = document.getElementById('db-type-select').value;
    const config = {
        type: type,
        host: document.getElementById('db-host').value,
        port: document.getElementById('db-port').value,
        name: document.getElementById('db-name').value,
        user: document.getElementById('db-user').value,
        password: document.getElementById('db-password').value
    };
    
    axios.post('/api/system/configs', {config_key: 'db_config_test', config_value: JSON.stringify(config)}).then(res => {
        if (res.data.ok) {
            alert('数据库连接测试成功');
        } else {
            alert(res.data.message || '连接失败');
        }
    }).catch(e => alert('连接失败: ' + (e.response && e.response.data.message || e.message)));
}

function backupDatabase() {
    axios.post('/api/system/backup').then(res => {
        if (res.data.ok) {
            const a = document.createElement('a');
            a.href = '/api/system/backup/download';
            a.download = 'ipam_backup_' + new Date().toISOString().slice(0,19).replace(/[:T]/g, '-') + '.db';
            a.click();
            document.getElementById('backup-result').innerHTML = '<div class="alert alert-success">备份文件已生成，开始下载</div>';
        } else {
            document.getElementById('backup-result').innerHTML = '<div class="alert alert-danger">' + res.data.message + '</div>';
        }
    }).catch(e => {
        document.getElementById('backup-result').innerHTML = '<div class="alert alert-danger">备份失败: ' + e.message + '</div>';
    });
}

function restoreDatabase() {
    const file = document.getElementById('restore-file').files[0];
    if (!file) return;
    
    const form = new FormData();
    form.append('file', file);
    
    axios.post('/api/system/restore', form).then(res => {
        if (res.data.ok) {
            alert('备份恢复成功，请重启服务');
        } else {
            alert(res.data.message || '恢复失败');
        }
    }).catch(e => alert('恢复失败: ' + (e.response && e.response.data.message || e.message)));
}

document.getElementById('restore-file').addEventListener('change', restoreDatabase);

loadSystemInfo();
</script>
{% endblock %}
