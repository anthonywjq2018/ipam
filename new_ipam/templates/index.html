{% extends "base.html" %}
{% block title %}仪表盘 - IPAM 系统{% endblock %}

{% block content %}
<div class="page-header mb-4 fade-in">
    <h2 class="mb-1"><i class="bi bi-speedometer2 me-2"></i>仪表盘</h2>
    <p class="mb-0">系统概览与快速操作</p>
</div>

<!-- 统计卡片 -->
<div class="row g-3 g-lg-4 mb-4">
    <div class="col-sm-6 col-xl-3">
        <div class="card stat-card h-100">
            <div class="card-body d-flex align-items-center">
                <div class="stat-icon">
                    <i class="bi bi-hdd-rack"></i>
                </div>
                <div class="ms-3">
                    <small class="d-block">交换机总数</small>
                    <h4 class="mb-0 stat-number" id="total-switches">0</h4>
                </div>
            </div>
        </div>
    </div>
    <div class="col-sm-6 col-xl-3">
        <div class="card stat-card h-100">
            <div class="card-body d-flex align-items-center">
                <div class="stat-icon">
                    <i class="bi bi-link-45deg"></i>
                </div>
                <div class="ms-3">
                    <small class="d-block">IP-MAC 绑定</small>
                    <h4 class="mb-0 stat-number" id="total-bindings">0</h4>
                </div>
            </div>
        </div>
    </div>
    <div class="col-sm-6 col-xl-3">
        <div class="card stat-card h-100">
            <div class="card-body d-flex align-items-center">
                <div class="stat-icon">
                    <i class="bi bi-pc-display"></i>
                </div>
                <div class="ms-3">
                    <small class="d-block">活跃设备</small>
                    <h4 class="mb-0 stat-number" id="active-devices">0</h4>
                </div>
            </div>
        </div>
    </div>
    <div class="col-sm-6 col-xl-3">
        <div class="card stat-card h-100">
            <div class="card-body d-flex align-items-center">
                <div class="stat-icon">
                    <i class="bi bi-person-check"></i>
                </div>
                <div class="ms-3">
                    <small class="d-block">信息完备</small>
                    <h4 class="mb-0 stat-number" id="info-complete">0</h4>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="row g-3 g-lg-4">
    <div class="col-lg-8">
        <div class="card h-100">
            <div class="card-header">
                <h5><i class="bi bi-lightning-charge me-2"></i>快速操作</h5>
            </div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-sm-6 col-md-3">
                        <a href="{{ url_for('switches_page') }}" class="quick-action-btn btn d-flex flex-column align-items-center justify-content-center p-3">
                            <i class="bi bi-plus-circle fs-2"></i>
                            <span>添加交换机</span>
                        </a>
                    </div>
                    <div class="col-sm-6 col-md-3">
                        <a href="{{ url_for('bindings_page') }}" class="quick-action-btn btn d-flex flex-column align-items-center justify-content-center p-3">
                            <i class="bi bi-link-45deg fs-2"></i>
                            <span>查看绑定</span>
                        </a>
                    </div>
                    <div class="col-sm-6 col-md-3">
                        <a href="{{ url_for('bindings_page') }}" class="quick-action-btn btn d-flex flex-column align-items-center justify-content-center p-3">
                            <i class="bi bi-download fs-2"></i>
                            <span>导出 CSV</span>
                        </a>
                    </div>
                    <div class="col-sm-6 col-md-3">
                        <a href="{{ url_for('switches_page') }}" class="quick-action-btn btn d-flex flex-column align-items-center justify-content-center p-3">
                            <i class="bi bi-upload fs-2"></i>
                            <span>导入数据</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="col-lg-4">
        <div class="card h-100">
            <div class="card-header">
                <h5><i class="bi bi-bar-chart-line me-2"></i>按交换机统计</h5>
            </div>
            <div class="card-body">
                <div id="switch-stats">
                    <div class="empty-state">
                        <i class="bi bi-inbox"></i>
                        <p>暂无交换机数据</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
